[browser]
gatherUsageStats = false

[server]
headless = true
# Bind all interfaces: Render's proxy connects over the container's network.
# `serverAddress` is intentionally unset; pointing the browser at "localhost"
# breaks the WebSocket handshake behind Render's proxy. Port comes from $PORT.
address = "0.0.0.0"
enableXsrfProtection = true

# Neutral light base. The app ships its own grayscale palette via CSS custom
# properties with a Light/Dark toggle, so Streamlit's built-in dark colors
# would otherwise paint dark surfaces onto the light theme.
[theme]
base = "light"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FAFAFA"
textColor = "#0B0B0C"
primaryColor = "#0B0B0C"
font = "sans serif"
